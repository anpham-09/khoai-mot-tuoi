<template id="letter-template"><article class="letter-content" id="letter-content" hidden><div class="letter-date">05 tháng 11 năm 2026 · Sinh nhật đầu tiên của con</div><h3 tabindex="-1" id="letter-greeting">Khoai thương mến,</h3><p>Hôm nay con tròn một tuổi.</p><p>Chú viết những dòng này khi con chưa thể tự đọc. Có lẽ bây giờ, thứ con thích hơn một lá thư là một món đồ chơi, một cái ôm, hay một người chịu ngồi chơi cùng con.</p><p>Nhưng chú muốn để dành cho con một món quà mà sau này con vẫn có thể mở ra.</p><p>Những tấm ảnh ở đây giữ lại một năm con lớn lên. Con sẽ thấy mình từng bé xíu ra sao, đã cười thế nào, và có bao nhiêu vòng tay ở bên con. Khi con xem lại, có thể mọi thứ đã thay đổi nhiều rồi. Chú mong những tấm hình này vẫn giúp con cảm nhận được sự yêu thương của nhà mình.</p><p>Chú không biết sau này con sẽ thích điều gì, muốn đi đâu, hay mơ trở thành ai. Chú chỉ mong con khỏe mạnh, có lòng tốt, có những người bạn tử tế, và đủ tự tin để sống theo cách khiến mình thấy vui.</p><p>Những lúc chưa làm được một điều gì đó, cứ cho mình thêm thời gian nhé. Lớn lên cũng giống những ngày con tập khám phá thế giới trong những bức ảnh này: từng chút một, rồi con sẽ đi xa hơn.</p><p>Món quà này chú làm cho con bằng những điều chú biết: một chút code, những tấm ảnh của gia đình, và rất nhiều thương mến.</p><p class="letter-wish">Chúc mừng sinh nhật, An Duy.<br>Chúc con có một tuổi thơ thật đẹp để mang theo suốt đời.</p><p class="letter-signature">Thương con,<br><em>Chú An</em></p><div class="letter-actions"><button class="text-button" id="save-letter" type="button">Giữ lại lá thư ↓</button><button class="text-button" id="close-letter" type="button">Gấp thư lại ↑</button></div></article></template>
